<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Upload — Webserv42</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			min-height: 100vh;
			background: #f4f4f4;
			display: flex;
			align-items: flex-start; /* place the main card near the top */
			justify-content: center;
			padding: 48px 24px; /* extra top padding so the card is visible near the top */
		}
		.container {
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 10px 40px rgba(0,0,0,0.08);
			padding: 32px;
			max-width: 720px;
			width: 100%;
		}
		h1 { font-size: 22px; margin-bottom: 8px; color: #222; text-align: center }
		.subtitle { color: #666; margin-bottom: 18px; text-align: center }

		form{ display:block; }
		.field { margin-bottom: 16px; }
		label { display:block; font-weight:700; margin-bottom:6px; color:#333; text-align:center }
		input[type="file"] { display:block; padding:10px; border-radius:8px; border:1px solid #ddd; background:#fafafa; margin:0 auto }
		input[type="text"], select { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; max-width:720px; margin:0 auto }

		.controls { display:flex; gap:12px; justify-content:center; margin-top:18px }
		.btn-primary { background:#3498db; color:#fff; border:0; padding:10px 18px; border-radius:10px; cursor:pointer; font-weight:700 }
		.btn-secondary { background:#e0e0e0; color:#333; border:0; padding:10px 18px; border-radius:10px; cursor:pointer; }

		.hint { font-size:13px; color:#666; margin-top:8px }
		.btn-home { position: fixed; top: 18px; left: 18px; background:#3498db; color:#fff; padding:10px 14px; border-radius:8px; text-decoration:none }
		@media (min-width:720px){ .controls { justify-content: space-between; width: 50%; margin: 0 auto } }

		/* Files list styles (server will inject list items into #file-list) */
		.files-section { margin-top: 22px; }
		.files-section h2 { font-size: 18px; margin-bottom: 8px; text-align:center }
		.file-list { list-style: none; padding: 0; margin: 0 auto; max-width: 720px; }
		.file-list li { padding: 10px 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; background:#fafafa; display:flex;justify-content:space-between;align-items:center }
		.file-list li.empty { text-align:center; color:#777 }
	</style>
</head>
<body>
	<a href="/" class="btn-home" onclick="window.location.href='/'; return false;">← Accueil</a>
	<div class="container">
		<h1>Upload de fichiers</h1>

		<form method="POST" action="/uploads" enctype="multipart/form-data">
			<div class="field">
				<input id="file" name="file" type="file" required>
			</div>

                <!-- Browse uploaded files -->


			<div class="controls">
				<button type="submit" class="btn-primary">Envoyer</button>
				<button type="reset" class="btn-secondary">Réinitialiser</button>
			</div>
		</form>

		<!-- Files list: server should inject <li> items into #file-list -->
		<section class="files-section">
			<h2>Fichiers présents dans le dépôt</h2>
			<ul id="file-list" class="file-list">
				<li class="empty"></li>
			</ul>
		</section>
	</div>
</body>
</html>
