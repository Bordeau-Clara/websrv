<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELETE Request Test - WebServ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 20px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-size: 1.5em;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .delete-section {
            margin-top: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .file-input-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .btn-delete {
            padding: 12px 24px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-delete:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .btn-delete:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            color: #856404;
            font-size: 14px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .result-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .result-message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .result-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }

        .footer p {
            font-size: 0.9em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="/" class="back-link" title="Back to Home">←</a>
            <h1>🗑️ DELETE Request Test</h1>
        </div>
        <div class="nav-links">
            <a href="/post/" class="nav-link">📁 View Files</a>
        </div>
    </div>

    <div class="main-container">
        <div class="container">
            <h2>Delete a File</h2>

            <div class="info-box">
                <strong>⚠️ Warning</strong>
                Enter the filename you want to delete. This action cannot be undone.
            </div>

            <div class="delete-section">
                <div class="input-group">
                    <label for="filename">Filename</label>
                    <div class="file-input-box">
                        <input 
                            type="text" 
                            id="filename" 
                            placeholder="e.g., image.jpg"
                            autocomplete="off"
                        >
                        <button id="btnDelete" class="btn-delete">
                            <span>🗑️</span>
                            <span>Delete</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
            </div>

            <div id="resultMessage" class="result-message"></div>
        </div>
    </div>

    <div class="footer">
        <p>By Clara &amp; Ayoub - WebServ</p>
    </div>

    <script>
        const filenameInput = document.getElementById('filename');
        const btnDelete = document.getElementById('btnDelete');
        const resultMessage = document.getElementById('resultMessage');
        const loading = document.getElementById('loading');

        // Allow Enter key to trigger delete
        filenameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnDelete.click();
            }
        });

        // Delete file
        btnDelete.addEventListener('click', async () => {
            const filename = filenameInput.value.trim();

            if (!filename) {
                showResult('❌ Please enter a filename.', false);
                return;
            }

            btnDelete.disabled = true;
            loading.style.display = 'block';
            resultMessage.style.display = 'none';

            try {
                const url = `/${encodeURIComponent(filename)}`;

                const response = await fetch(url, {
                    method: 'DELETE'
                });

                loading.style.display = 'none';

                if (response.ok) {
                    showResult(`✅ File "${filename}" deleted successfully!`, true);
                    filenameInput.value = '';
                } else {
                    // Extract only the status line from error response
                    const errorText = await response.text();
                    const statusLine = errorText.split('\n')[0] || `${response.status} ${response.statusText}`;
                    showResult(`❌ Delete error: ${statusLine}`, false);
                }
            } catch (error) {
                loading.style.display = 'none';
                showResult(`❌ Connection error: ${error.message}`, false);
            } finally {
                btnDelete.disabled = false;
            }
        });

        // Show result
        function showResult(message, isSuccess) {
            resultMessage.textContent = message;
            resultMessage.className = 'result-message ' + (isSuccess ? 'success' : 'error');
            resultMessage.style.display = 'block';
        }
    </script>
</body>
</html>
