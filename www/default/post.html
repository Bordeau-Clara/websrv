<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST Request Test - WebServ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 20px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-size: 1.5em;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .drop-zone {
            border: 3px dashed #3498db;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            border-color: #2c3e50;
            background: #f0f2ff;
        }

        .drop-zone.drag-over {
            border-color: #2c3e50;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .drop-zone-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .drop-zone-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .drop-zone-hint {
            color: #999;
            font-size: 14px;
        }

        .file-input {
            display: none;
        }

        .preview-container {
            margin: 20px 0;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .file-info {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
            display: none;
        }

        .file-info p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .file-name {
            font-weight: bold;
            color: #333;
        }

        .btn-post {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
            margin-top: 20px;
        }

        .btn-post:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-post:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .result-message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .result-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }

        .footer p {
            font-size: 0.9em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="/" class="back-link" title="Back to Home">←</a>
            <h1>📤 POST Request Test</h1>
        </div>
        <div class="nav-links">
            <a href="/post/" class="nav-link">📁 View Uploads</a>
        </div>
    </div>

    <div class="main-container">
        <div class="container">
            <h2>Upload Images</h2>
            
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-icon">🖼️</div>
                <div class="drop-zone-text">Drag and drop your image here</div>
                <div class="drop-zone-hint">or click to select a file</div>
            </div>

            <input type="file" id="fileInput" class="file-input" accept="image/*">

            <div class="preview-container">
                <img id="previewImage" class="preview-image" alt="Preview">
            </div>

            <div class="file-info" id="fileInfo">
                <p>File: <span class="file-name" id="fileName"></span></p>
                <p>Size: <span id="fileSize"></span></p>
                <p>Type: <span id="fileType"></span></p>
            </div>

            <button id="btnPost" class="btn-post">📨 Upload Image</button>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
            </div>

            <div id="resultMessage" class="result-message"></div>
        </div>
    </div>

    <div class="footer">
        <p>By Clara &amp; Ayoub - WebServ</p>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileType = document.getElementById('fileType');
        const btnPost = document.getElementById('btnPost');
        const resultMessage = document.getElementById('resultMessage');
        const loading = document.getElementById('loading');

        let selectedFile = null;

        // Click on drop zone
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag & Drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Handle selected file
        function handleFile(file) {
            // Check if it's an image
            if (!file.type.startsWith('image/')) {
                showResult('Please select a valid image file.', false);
                return;
            }

            selectedFile = file;

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
            };
            reader.readAsDataURL(file);

            // Show file information
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileType.textContent = file.type;
            fileInfo.style.display = 'block';

            // Show POST button
            btnPost.style.display = 'block';

            // Hide previous result message
            resultMessage.style.display = 'none';
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Send the image
        btnPost.addEventListener('click', async () => {
            if (!selectedFile) {
                showResult('No file selected.', false);
                return;
            }

            btnPost.disabled = true;
            loading.style.display = 'block';
            resultMessage.style.display = 'none';

            try {
                // Read file as ArrayBuffer
                const fileBuffer = await selectedFile.arrayBuffer();
                
                // Build URL with filename
                const url = `/${encodeURIComponent(selectedFile.name)}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': selectedFile.type || 'application/octet-stream'
                    },
                    body: fileBuffer
                });

                loading.style.display = 'none';

                if (response.ok) {
                    const result = await response.text();
                    showResult(`✅ Image uploaded successfully!`, true);
                } else {
                    // Extract only the status line from error response
                    const errorText = await response.text();
                    const statusLine = errorText.split('\n')[0] || `${response.status} ${response.statusText}`;
                    showResult(`❌ Upload error: ${statusLine}`, false);
                }
            } catch (error) {
                loading.style.display = 'none';
                showResult(`❌ Connection error: ${error.message}`, false);
            } finally {
                btnPost.disabled = false;
            }
        });

        // Show result
        function showResult(message, isSuccess) {
            resultMessage.textContent = message;
            resultMessage.className = 'result-message ' + (isSuccess ? 'success' : 'error');
            resultMessage.style.display = 'block';
        }
    </script>
</body>
</html>
