<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload d'images</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .drop-zone.drag-over {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .drop-zone-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .drop-zone-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .drop-zone-hint {
            color: #999;
            font-size: 14px;
        }

        .file-input {
            display: none;
        }

        .preview-container {
            margin: 20px 0;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .file-info {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
            display: none;
        }

        .file-info p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .file-name {
            font-weight: bold;
            color: #333;
        }

        .btn-post {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
            margin-top: 20px;
        }

        .btn-post:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-post:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .result-message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .result-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Upload d'Images</h1>
        
        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">🖼️</div>
            <div class="drop-zone-text">Glissez-déposez votre image ici</div>
            <div class="drop-zone-hint">ou cliquez pour sélectionner un fichier</div>
        </div>

        <input type="file" id="fileInput" class="file-input" accept="image/*">

        <div class="preview-container">
            <img id="previewImage" class="preview-image" alt="Aperçu">
        </div>

        <div class="file-info" id="fileInfo">
            <p>Fichier: <span class="file-name" id="fileName"></span></p>
            <p>Taille: <span id="fileSize"></span></p>
            <p>Type: <span id="fileType"></span></p>
        </div>

        <button id="btnPost" class="btn-post">📨 Envoyer l'image</button>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
        </div>

        <div id="resultMessage" class="result-message"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileType = document.getElementById('fileType');
        const btnPost = document.getElementById('btnPost');
        const resultMessage = document.getElementById('resultMessage');
        const loading = document.getElementById('loading');

        let selectedFile = null;

        // Click sur la zone de dépôt
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag & Drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Gérer le fichier sélectionné
        function handleFile(file) {
            // Vérifier que c'est une image
            if (!file.type.startsWith('image/')) {
                showResult('Veuillez sélectionner un fichier image valide.', false);
                return;
            }

            selectedFile = file;

            // Afficher l'aperçu
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
            };
            reader.readAsDataURL(file);

            // Afficher les informations du fichier
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileType.textContent = file.type;
            fileInfo.style.display = 'block';

            // Afficher le bouton POST
            btnPost.style.display = 'block';

            // Cacher le message de résultat précédent
            resultMessage.style.display = 'none';
        }

        // Formater la taille du fichier
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Envoyer l'image
        btnPost.addEventListener('click', async () => {
            if (!selectedFile) {
                showResult('Aucun fichier sélectionné.', false);
                return;
            }

            btnPost.disabled = true;
            loading.style.display = 'block';
            resultMessage.style.display = 'none';

            try {
                // Lire le fichier en ArrayBuffer
                const fileBuffer = await selectedFile.arrayBuffer();
                
                // Construire l'URL avec le nom du fichier
                const url = `/${encodeURIComponent(selectedFile.name)}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': selectedFile.type || 'application/octet-stream'
                    },
                    body: fileBuffer
                });

                loading.style.display = 'none';

                if (response.ok) {
                    const result = await response.text();
                    showResult(`✅ Image envoyée avec succès ! ${result}`, true);
                } else {
                    const errorText = await response.text();
                    showResult(`❌ Erreur lors de l'envoi: ${response.status} - ${errorText}`, false);
                }
            } catch (error) {
                loading.style.display = 'none';
                showResult(`❌ Erreur de connexion: ${error.message}`, false);
            } finally {
                btnPost.disabled = false;
            }
        });

        // Afficher le résultat
        function showResult(message, isSuccess) {
            resultMessage.textContent = message;
            resultMessage.className = 'result-message ' + (isSuccess ? 'success' : 'error');
            resultMessage.style.display = 'block';
        }
    </script>
</body>
</html>
