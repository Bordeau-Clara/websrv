<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Upload SPA Ultra-Simple</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f9; }
        .upload-container { text-align: center; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; }
        
        /* Zone de Drop */
        #drop-zone {
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 40px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }
        #drop-zone.dragover { background: #e7f3ff; border-color: #0056b3; }
        
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="upload-container">
    <h3>Envoyer une image</h3>
    
    <div id="drop-zone">
        Glissez votre image ici <br> ou <strong>cliquez pour parcourir</strong>
    </div>
    <input type="file" id="file-input" hidden accept="image/*">
    
    <p id="file-name">Aucun fichier sélectionné</p>
    
    <button id="upload-btn" disabled>Envoyer l'image</button>
    <div id="status"></div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const fileName = document.getElementById('file-name');
    const status = document.getElementById('status');
    let selectedFile = null;

    // --- Gestion de la sélection ---
    dropZone.onclick = () => fileInput.click();
    
    fileInput.onchange = (e) => handleFiles(e.target.files[0]);

    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('dragover');
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files[0]);
    };

    function handleFiles(file) {
        if (file && file.type.startsWith('image/')) {
            selectedFile = file;
            fileName.textContent = `Fichier prêt : ${file.name}`;
            uploadBtn.disabled = false;
        }
    }

    // --- L'appel POST (SPA) ---
    uploadBtn.onclick = async () => {
        const formData = new FormData();
        formData.append('image', selectedFile);

        status.textContent = "⏳ Envoi en cours...";
        status.style.color = "blue";
        uploadBtn.disabled = true;

        try {
            // Remplace l'URL par ton vrai endpoint d'API
            const response = await fetch('https://localhost:8002/img/test', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                status.textContent = "✅ Succès ! Statut : " + response.status;
                status.style.color = "green";
            } else {
                throw new Error();
            }
        } catch (error) {
            status.textContent = "❌ Erreur lors de l'envoi.";
            status.style.color = "red";
        } finally {
            uploadBtn.disabled = false;
        }
    };
</script>

</body>
</html>
