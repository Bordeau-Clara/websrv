<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Upload avec Prévisualisation</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .upload-card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 400px; text-align: center; }
        
        /* Zone de Drop */
        #drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
            background: #f8fafc;
            color: #64748b;
        }
        #drop-zone:hover { border-color: #3b82f6; background: #eff6ff; }
        #drop-zone.dragover { border-color: #3b82f6; background: #dbeafe; transform: scale(1.02); }
        
        /* Prévisualisation */
        #preview-container {
            margin: 15px 0;
            display: none; /* Caché par défaut */
        }
        #preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            object-fit: cover;
        }

        /* Infos fichier */
        #file-info { margin: 15px 0; font-size: 0.9rem; color: #334155; }
        .size-tag { color: #64748b; font-weight: normal; font-size: 0.85rem; }

        /* Bouton & Status */
        button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.9rem; min-height: 20px; }
    </style>
</head>
<body>

<div class="upload-card">
    <h3 style="margin-top:0;">Uploader une image</h3>
    
    <div id="drop-zone">
        <p style="margin:0;">Glissez votre image ici<br><small>ou cliquez pour parcourir</small></p>
    </div>
    <input type="file" id="file-input" hidden accept="image/*">
    
    <div id="preview-container">
        <img id="preview-image" src="" alt="Aperçu">
    </div>

    <div id="file-info">Aucun fichier sélectionné</div>
    
    <button id="upload-btn" disabled>Envoyer maintenant</button>
    <div id="status"></div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const fileInfo = document.getElementById('file-info');
    const previewContainer = document.getElementById('preview-container');
    const previewImage = document.getElementById('preview-image');
    const status = document.getElementById('status');
    
    let selectedFile = null;

    // --- Utils : Convertir la taille ---
    function formatBytes(bytes, decimals = 2) {
        if (bytes === 0) return '0 Octets';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Octets', 'Ko', 'Mo', 'Go'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    // --- Gestion des événements ---
    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(e.target.files[0]);

    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('dragover');
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files[0]);
    };

    function handleFiles(file) {
        if (file && file.type.startsWith('image/')) {
            selectedFile = file;
            
            // 1. Mise à jour du texte avec la taille
            fileInfo.innerHTML = `<strong>${file.name}</strong> <span class="size-tag">(${formatBytes(file.size)})</span>`;
            
            // 2. Génération de la prévisualisation
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block'; // On affiche l'image
            };
            reader.readAsDataURL(file);

            uploadBtn.disabled = false;
            status.textContent = "";
        } else {
            status.textContent = "❌ Le fichier doit être une image.";
            status.style.color = "red";
        }
    }

    // --- Envoi POST ---
    uploadBtn.onclick = async () => {
        if (!selectedFile) return;

        const formData = new FormData();
        formData.append('image', selectedFile);

        uploadBtn.disabled = true;
        uploadBtn.textContent = "Envoi en cours...";
        
        try {
            // Test vers httpbin pour vérifier que ça marche
            const response = await fetch('https://httpbin.org/post', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                status.textContent = "✅ Envoyé avec succès !";
                status.style.color = "green";
                uploadBtn.textContent = "Envoyer une autre";
            } else {
                throw new Error("Erreur serveur");
            }
        } catch (error) {
            status.textContent = "❌ Erreur lors de l'envoi.";
            status.style.color = "red";
            uploadBtn.textContent = "Réessayer";
        } finally {
            uploadBtn.disabled = false;
        }
    };
</script>

</body>
</html>
