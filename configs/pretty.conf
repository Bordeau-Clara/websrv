server
{
	listen 8002;
	location /
	{
		root ./www/pretty/root/;
		allow_methods  GET;
		error_page 404 500 ./www/error_pages/404.html;
		autoindex on;
	}
	
	location /img/
	{
		allow_methods  GET POST DELETE;
		post_directory ./www/pretty/post/;
		client_max_body_size 3000000;
		client_max_header_size 3000000;
	}
}
