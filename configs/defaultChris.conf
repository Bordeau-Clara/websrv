server {
	listen 8002;

	location / {
		allow_methods GET POST;
		root ./ressources/;

		error_page 400 error_pages/400.html;
		error_page 403 error_pages/403.html;
		error_page 404 error_pages/404.html;
		error_page 500 error_pages/500.html;
		error_page 504 error_pages/504.html;
	}
	
	location /tours {
		autoindex on;
		root ./ressources/;
		index aled.html;
		allow_methods GET POST;
	}
	
	location /aled {
	}

	location /red {
		root ./ressources/;
		return /tours;
	}

	location /uploads {
		root ./ressources/;
		autoindex on;
		allow_methods GET POST DELETE;
		post_directory /ressources/uploads;
	}

	location /cgi-bin {
		allow_methods GET POST;
		root ./ressources/;
		index time.py;
		cgi .py /usr/bin/python3;
		cgi .sh /bin/bash;
	}

	location /cookies {
		allow_methods GET;
		root ./ressources/;
	}
}
