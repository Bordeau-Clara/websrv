server
{
	listen 8002;
	location /
	{
		root ./www/default/;
		allow_methods  DELETE POST GET;
		client_max_body_size 3000000;
		client_max_header_size 3000000;
		autoindex on;
		post_directory ./www/default/post/;
	}
	
	location /ret
	{
		return 303 https://42.fr;
		autoindex on;
		allow_methods GET POST;
	}

	location /blue
	{
		alias /red;
		root ./www/default/;
	}

	location /cgi-bin
	{
		root ./www/default/;
		allow_methods GET POST DELETE;
		cgi .py /usr/bin/python3;
		cgi .php /usr/bin/php;
		cgi .sh;
	}
	location /post
	{
		root ./www/default/;
		allow_methods GET;
		autoindex on;
	}
	location /img
	{
		root ./www/default/;
		allow_methods GET;
		autoindex on;
	}
}

server {
	listen 8003;

	location / {
		allow_methods GET POST;
		root ./ressources/;
		autoindex on;

		error_page 400 error_pages/400.html;
		error_page 403 error_pages/403.html;
		error_page 404 error_pages/404.html;
		error_page 500 error_pages/500.html;
		error_page 504 error_pages/504.html;
	}
	
	location /tours {
		autoindex on;
		root ./ressources/;
		index aled.html;
		allow_methods GET POST;
	}
	
	location /aled {
		autoindex on;
	}

	location /red {
		autoindex on;
		root ./ressources/;
		return /tours;
	}

	location /uploads {
		autoindex on;
		root ./ressources/;
		autoindex on;
		allow_methods GET POST DELETE;
		post_directory /ressources/uploads;
	}

	location /cgi-bin {
		autoindex on;
		allow_methods GET POST;
		root ./ressources/;
		index time.py;
		cgi .py /usr/bin/python3;
		cgi .sh /bin/bash;
	}

	location /cookies {
		autoindex on;
		allow_methods GET;
		root ./ressources/;
	}
}
