server
{
	listen 8002;
	location /
	{
		root ./www/default/;
		allow_methods  DELETE POST GET;
		client_max_body_size 3000000;
		client_max_header_size 3000000;
		autoindex on;
		post_directory ./www/default/post/;
	}
	
	location /ret
	{
		return 303 https://42.fr;
		autoindex on;
		allow_methods GET POST;
	}

	location /blue
	{
		alias /red;
		root ./www/default/;
	}

	location /cgi-bin
	{
		root ./www/default/;
		allow_methods GET POST DELETE;
		cgi .py /usr/bin/python3;
		cgi .php /usr/bin/php;
		cgi .sh;
	}
	location /post
	{
		root ./www/default/;
		allow_methods GET;
		autoindex on;
	}
	location /img
	{
		root ./www/default/;
		allow_methods GET;
		autoindex on;
	}
}

server
{
	location /
	{
		allow_methods GET POST DELETE;
		root ./www/default;
		post_directory ./www/default/post/;
		client_max_body_size 3000000;
		client_max_header_size 3000000;
	}

	location /post/
	{
		autoindex on;
		root ./www/default/;
	}

	location /return
	{
		return 303 https://42.fr;
	}

	location /cgi-bin
	{
		root ./www/default/;
		cgi .sh;
	}

	location /notAllowed
	{
		root ./www/default/;
	}

	location /smallHeader
	{
		root ./www/default;
		client_max_header_size 10;
	}

	location /smallBody
	{
		allow_methods GET POST DELETE;
		root ./www/default;
		post_directory ./www/default/post/;
		client_max_body_size 10;
	}

	location /postDir/
	{
		allow_methods GET POST DELETE;
		root ./www/default/;
		post_directory ./www/default/post;
	}
}
